<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Electron</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!-- 
    - style-src 'unsafe-inline' é necessário porque o Vue aplica estilos inline (:style) e o Vite injeta CSS no dev.
    - font-src 'self' data: cobre a Courier Prime do @fontsource, que fica empacotada no app.
    - script-src 'self' bloqueia qualquer script inline ou remoto. Se o HMR do Vite falhar no dev, acrescente ws://localhost:* em connect-src. 
-->
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
