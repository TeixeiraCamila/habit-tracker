<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Habit Tracker</title>
    <!-- Página carregada pelo Electron no renderer; o CSP abaixo limita scripts, estilos e conexões. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!-- CSS inline é necessário para o Vue/Vite; fontes vêm do @fontsource local. -->
    <!-- O HMR do Vite pode exigir ws://localhost:* em connect-src durante o desenvolvimento. -->
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
